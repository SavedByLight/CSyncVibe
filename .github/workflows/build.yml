name: Build & Release CSyncVibe

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases / upload assets

jobs:
  build:
    runs-on: ubuntu-latest

    # Map secrets to env so we can safely test them in if: conditions
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew missing – downloading Gradle and generating wrapper"
            curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      # ---------- Debug build (always) ----------
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSyncVibe-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---------- Signed release (only when keystore secret is set) ----------
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.keystore
          echo "KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK artifact
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: CSyncVibe-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # ---------- Collect APKs for the release ----------
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/CSyncVibe-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-assets/CSyncVibe-release.apk
          fi
          ls -la release-assets/

      # ---------- Versioned release on tag (v*) ----------
      - name: Create versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CSyncVibe ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Continuous release on every push to main / manual run ----------
      - name: Create continuous GitHub Release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous build #${{ github.run_number }}
          draft: false
          prerelease: true
          body: |
            Automatic build from `${{ github.sha }}` on `${{ github.ref_name }}`.

            - Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}

            ### Downloads
            - **CSyncVibe-debug.apk** – always included
            - **CSyncVibe-release.apk** – included when signing secrets are configured
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
